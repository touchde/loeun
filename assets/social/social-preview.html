<!doctype html>
<!-- Source for social-preview.png (1280x640). Re-render with headless Chrome:
     chrome --headless=new --window-size=1280,640 --screenshot=social-preview.png social-preview.html -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    background:
      radial-gradient(700px 520px at 18% 50%, rgb(255 110 40 / 0.22), transparent 70%),
      #0F1013;
    color: #F1F0EC;
    font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
    display: flex; align-items: center; gap: 72px; padding: 0 96px; box-sizing: border-box;
  }
  .icon { width: 300px; height: 300px; flex: none; filter: drop-shadow(0 24px 40px rgb(0 0 0 / .45)); }
  .text { display: grid; gap: 26px; }
  .word { height: 116px; width: auto; display: block; }
  .tag { font-size: 40px; line-height: 1.25; font-weight: 600; letter-spacing: -0.01em; max-width: 18ch; margin: 0; }
  .meta { display: flex; gap: 14px; align-items: center; font-size: 22px; color: #A7A8AF; font-weight: 500; }
  .km { font-family: "Khmer Sangam MN", "Noto Sans Khmer", sans-serif; color: #FFB020; font-size: 26px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #4A4B52; }
</style>
</head>
<body>
  <img class="icon" src="../logo/loeun-icon.svg" alt="">
  <div class="text">
    <img class="word" src="../logo/loeun-wordmark-dark.svg" alt="loeun">
    <p class="tag">The fast, open-source download manager.</p>
    <div class="meta"><span class="km">លឿន</span><span class="dot"></span><span>Windows · macOS · Linux</span><span class="dot"></span><span>MIT / Apache-2.0</span></div>
  </div>
</body>
</html>
