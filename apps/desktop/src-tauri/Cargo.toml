[package]
name = "loeun-desktop"
description = "Loeun desktop app (Tauri 2)."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "loeun_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
loeun-core.workspace = true
tauri = { version = "2.12.5", features = [] }

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
