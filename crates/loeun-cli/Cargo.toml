[package]
name = "loeun-cli"
description = "Command-line interface for the Loeun download manager."
readme = "README.md"
keywords = ["download", "downloader", "cli", "accelerator", "resume"]
categories = ["command-line-utilities", "network-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "loeun"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
loeun-core.workspace = true

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
