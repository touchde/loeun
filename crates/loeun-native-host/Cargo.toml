[package]
name = "loeun-native-host"
description = "Native messaging host that connects the Loeun browser extension to the desktop app."
readme = "README.md"
keywords = ["download", "native-messaging", "browser-extension"]
categories = ["network-programming"]
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "loeun-native-host"
path = "src/main.rs"

[dependencies]
loeun-core.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
