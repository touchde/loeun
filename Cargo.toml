[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/touchde/loeun"
homepage = "https://github.com/touchde/loeun"
authors = ["The Loeun Contributors"]

[workspace.dependencies]
loeun-core = { path = "crates/loeun-core", version = "0.0.0" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that add noise without catching bugs.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
# Library code must not panic on bad input; tests may (see clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Fast-ish builds for the benchmark/fuzz harnesses.
[profile.bench]
debug = "line-tables-only"
